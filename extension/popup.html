<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  [hidden] { display: none !important; }
  body { width: 290px; margin: 0; padding: 18px; font-family: system-ui, "Segoe UI", sans-serif; color: #1F2340; background: #fff; }
  h1 { font-size: 20px; margin: 0 0 2px; background: linear-gradient(90deg, #FF6B8B, #7C5CFF);
       -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  p { margin: 0 0 12px; color: #8A8FA3; font-size: 13px; }
  input[type=email], input[type=password] { width: 100%; box-sizing: border-box; padding: 9px 12px; margin-bottom: 8px;
       border: 1px solid #E6E1FF; border-radius: 12px; font-size: 14px; }
  button { padding: 8px 18px; border: 0; border-radius: 999px; font-weight: 600; cursor: pointer; }
  .go { width: 100%; color: #fff; background: linear-gradient(90deg, #FF6B8B, #7C5CFF); }
  .ghost { background: #F7F5FF; color: #6142E0; }
  .err { color: #D6336C; font-size: 12px; min-height: 16px; margin-top: 6px; }
  .who { background: #E3F8F5; color: #14907F; padding: 8px 12px; border-radius: 12px; font-size: 13px; margin-bottom: 12px; }
  label.row { display: flex; align-items: center; gap: 8px; font-size: 14px; margin-bottom: 14px; }
</style>
</head>
<body>
  <h1>💌 Thinking of You</h1>
  <p>Know what they love.</p>

  <div id="login">
    <input id="email" type="email" placeholder="Email">
    <input id="pw" type="password" placeholder="Password">
    <button id="loginBtn" class="go">Sign in</button>
    <div id="err" class="err"></div>
  </div>

  <div id="main" hidden>
    <div class="who">✓ Connected as <b id="who"></b></div>
    <label class="row"><input id="toggle" type="checkbox"> Track my shopping</label>
    <button id="logout" class="ghost">Disconnect</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
